<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 270 150" width="270" height="150" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
@keyframes tw{0%,100%{opacity:.2;transform:scale(.55)}50%{opacity:1;transform:scale(1.1)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-14px)}}
@keyframes tail{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
.s{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
.bob{animation:bob 4s ease-in-out infinite}
.z{animation:zz 3.2s ease-in-out infinite;font-family:monospace;font-weight:bold;fill:#C77DFF}
.tail{transform-box:fill-box;transform-origin:left center;animation:tail 3s ease-in-out infinite}
</style>

<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C77DFF"/><stop offset="1" stop-color="#5A189A"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#160a2b"/><stop offset="1" stop-color="#0d0618"/></linearGradient>
</defs>
<g class="bob">
<rect x="6" y="8" width="258" height="130" rx="16" fill="url(#bg)" stroke="url(#bd)" stroke-width="2"/>
<text x="24" y="44" font-family="'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#E0AAFF">To-do List</text>
<text x="24" y="70" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#C9B6E8">A simple productivity app</text>
<text x="24" y="88" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11.5" fill="#C9B6E8">and frontend experiment</text>
<rect x="24" y="102" width="144.4" height="22" rx="11" fill="#3C096C"/>
<text x="35" y="117" font-family="ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#E0AAFF">View repository →</text>
<g transform="translate(238 34) scale(9)"><path class="s" style="animation-delay:0s" fill="#E0AAFF" d="M0 -1 Q0 0 1 0 Q0 0 0 1 Q0 0 -1 0 Q0 0 0 -1Z"/></g><g transform="translate(216 22) scale(4.5)"><path class="s" style="animation-delay:0.9s" fill="#C77DFF" d="M0 -1 Q0 0 1 0 Q0 0 0 1 Q0 0 -1 0 Q0 0 0 -1Z"/></g><g transform="translate(246 58) scale(3.5)"><path class="s" style="animation-delay:1.7s" fill="#9D4EDD" d="M0 -1 Q0 0 1 0 Q0 0 0 1 Q0 0 -1 0 Q0 0 0 -1Z"/></g>
</g></svg>