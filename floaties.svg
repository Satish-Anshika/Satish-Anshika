<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><style>
@keyframes tw{0%,100%{opacity:.2;transform:scale(.55)}50%{opacity:1;transform:scale(1.1)}}
@keyframes fl1{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes fl2{0%,100%{transform:translateY(-4px)}50%{transform:translateY(8px)}}
@keyframes fl3{0%,100%{transform:translate(0,0)}33%{transform:translate(5px,-8px)}66%{transform:translate(-4px,-3px)}}
@keyframes rise{0%{opacity:0;transform:translateY(8px) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translateY(-34px) scale(1.1)}}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-14px)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.35}50%{transform:scaleX(.8);opacity:.18}}
.s{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
.f1{animation:fl1 3.6s ease-in-out infinite}.f2{animation:fl2 4.4s ease-in-out infinite}.f3{animation:fl3 5.2s ease-in-out infinite}
.rise{animation:rise 4s ease-in infinite}
.shadow{transform-box:fill-box;transform-origin:center;animation:shadow 3.6s ease-in-out infinite}
.z{animation:zz 3.2s ease-in-out infinite;font-family:monospace;font-weight:bold;fill:#C77DFF}
